<html xmlns:th="http://www.thymeleaf.org">

<body>
	<h1>Input new employee:</h1>
	<form method="post" th:object="${employee}" th:action="@{/employee/crud/add}">

		<p>Input approval limit</p>
		<input type="number" th:field="*{approvalLimit}" />
		<p th:if="${#fields.hasErrors('approvalLimit')}" th:errors="*{approvalLimit}"></p>

		<p>Input name</p>
		<input type="text" th:field="*{name}" />
		<p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

		<p>Input person code</p>
		<input type="text" th:field="*{personCode}" />
		<p th:if="${#fields.hasErrors('personCode')}" th:errors="*{personCode}"></p>

		<p>Input surname</p>
		<input type="text" th:field="*{surname}" />
		<p th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}"></p>

		<p>Input status</p>
		<input type="text" th:field="*{status}" />
		<p th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></p>

		<button type="submit">Save employee</button>
	</form>

</body>

</html>
