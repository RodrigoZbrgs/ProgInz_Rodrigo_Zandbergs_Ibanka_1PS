<html xmlns:th="http://www.thymeleaf.org" >
<body>
<h1>Edit employeee:</h1>
    <form method="post" th:object="${employee}" th:action="@{/employee/crud/update/__${id}__}">

        <p>Input approval limit</p>
        <input type="number" th:field="*{approvalLimit}"/>

        <p>Input name</p>
        <input type="text" th:field="*{name}"/>

        <p>Input person code</p>
        <input type="text" th:field="*{personCode}"/>

        <p>Input surname</p>
        <input type="text" th:field="*{surname}"/>

        <p>Input status</p>
        <input type="text" th:field="*{status}"/>

        <button type="submit">Save employee</button>
    </form>
</body>
</html>
